name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            goos: windows
            goarch: amd64
            binary: smarter-olj.exe
            archive: smarter-olj-windows-amd64.zip
          - name: macos-amd64
            goos: darwin
            goarch: amd64
            binary: smarter-olj
            archive: smarter-olj-macos-amd64.tar.gz
          - name: macos-arm64
            goos: darwin
            goarch: arm64
            binary: smarter-olj
            archive: smarter-olj-macos-arm64.tar.gz
          - name: linux-amd64
            goos: linux
            goarch: amd64
            binary: smarter-olj
            archive: smarter-olj-linux-amd64.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/${{ matrix.name }}
          go build -trimpath -ldflags="-s -w" -o dist/${{ matrix.name }}/${{ matrix.binary }} ./cmd/job-scraper
          cp README.md LICENSE RELEASE_NOTES.md dist/${{ matrix.name }}/

      - name: Package Windows archive
        if: matrix.goos == 'windows'
        run: |
          cd dist/${{ matrix.name }}
          zip -9 ../${{ matrix.archive }} *

      - name: Package Unix archive
        if: matrix.goos != 'windows'
        run: |
          cd dist/${{ matrix.name }}
          tar -czf ../${{ matrix.archive }} *

      - name: Checksum
        run: |
          cd dist
          sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          body_path: RELEASE_NOTES.md
